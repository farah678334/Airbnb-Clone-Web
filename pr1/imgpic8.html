<!Doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apartment Photo Tour</title>
  <link rel="icon" type="image/png" href="airbnb.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
  
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* Photo Tour at top */
    .photo-tour {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 70px;
    }
    .photo-tour img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .photo-tour img:hover {
      transform: scale(1.05);
    }
	.tour-item { /* this is the wrapper around each image + caption */ 
	text-align: center; 
	/* ensures the label is centered under the image */ }
	.tour-item img { width: 100%; 
	height: 120px;
	object-fit: cover;
	border-radius: 8px; 
	cursor: pointer;	/* makes the image feel clickable */ 
	transition: transform 0.3s;
	}
	.tour-item img:hover {
	transform: scale(1.05); /* zoom effect on hover */
	}
	.tour-item span { display: block;
	margin-top: 5px;
	font-size: 14px; 
	font-weight: bold; color: #333;
	}

    /* Section layout */
/* Section layout */
.photo-section {
  display: grid;
  grid-template-columns: 1fr 2fr; /* left = name, right = photos */
  gap: 20px;
  margin-top: 40px;     /* consistent spacing above */
  margin-bottom: 40px;  /* consistent spacing below */
  align-items: flex-start; /* prevents stretching to tallest column */
}

/* Section name stays centered vertically */
.section-name {
  font-size: 28px;
  font-weight: bold;
  color: #333;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Default gallery styling */
.section-gallery {
  display: grid;
  gap: 10px;
}

/* One photo → large */
.section-gallery img:only-child {
  width: 100%;
  height: 500px;   /* adjust as you like */
  object-fit: cover;
  border-radius: 8px;
}

/* Two photos → side by side, each half height */
.section-gallery img:nth-child(2) {
  /* this selector means "if there are at least 2 images" */
}
.section-gallery img {
  width: 100%;
  object-fit: cover;
  border-radius: 8px;
}

/* Living Room (2 photos side by side) */
#living-room .section-gallery {
  grid-template-columns: 1fr 1fr;
}
#living-room .section-gallery img {
  height: 250px; /* half of large photo height */
}

/* Bathroom (2 photos side by side) */
#bathroom .section-gallery {
  grid-template-columns: 1fr 1fr;
}
#bathroom .section-gallery img {
  height: 250px; /* half of large photo height */
}



/* bedroom (4 photos → 2x2 grid) */
#bedroom .section-gallery {
  grid-template-columns: 1fr 1fr;
}
#bedroom .section-gallery img {
  height: 250px;
}


/* diningarea (4 photos → 2x2 grid) */
#diningarea .section-gallery {
  grid-template-columns: 1fr 1fr;
}
#diningarea .section-gallery img {
  height: 250px;
}


    /* Optional: back to top link */
    .back-to-top {
      text-align: center;
      margin-top: 20px;
    }
    .back-to-top a {
      text-decoration: none;
      color: black;
      font-weight: bold;
    }
	
	.back-to-top a:hover{
	text-decoration:underline;
	}
	
	
	/* Gallery layout */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
}

.gallery img {
    width: 100%;
    cursor: pointer;
    border-radius: 6px;
    transition: transform 0.3s;
}

.gallery img:hover {
    transform: scale(1.03);
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.90);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}


.modal-content {
    max-width: 80%;
    max-height: 80%;
}

/* Close button */
.close {
    position: absolute;
    top: 20px;
    left: 30px;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

/* Navigation buttons */
.prev, .next {
    position: absolute;
    top: 50%;
    font-size: 40px;
    color: white;
    cursor: pointer;
    user-select: none;
}

.prev {
    left: 40px;
}

.next {
    right: 40px;
}

/* Counter */
.counter {
    position: absolute;
    top: 20px;
    right: 40px;
    color: white;
    font-size: 16px;
}

.caption {
    margin-top: 16px;
    color: #ddd;
    font-size: 16px;
    text-align: center;
}

.back-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 42px;
  height: 42px;
  background: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 2000;
}

.back-btn i {
  font-size: 18px;
}

.back-btn:hover {
  background: #f2f2f2;
}

  </style>
</head>
<body>
  <div class="page-container">
  <a href="ap8.html" class="back-btn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>Apartment Photo Tour</h1>

    <!-- Photo Tour -->
	
    <div class="photo-tour ">
	<div class="tour-item ">
      <a href="#living-room"><img src="images/nice2/living area1.avif" alt="Living Room"></a><span>Living Room</span></div>
      <div class="tour-item"><a href="#kitchen"><img src="images/nice2/kitchen.avif" alt="Kitchen"></a><span>Full kitchen</span></div>
	  <div class="tour-item"><a href="#diningarea"><img src="images/nice2/dining area1.avif" alt="dining area"></a><span>Dining Area</span></div>
     <div class="tour-item"> <a href="#bedroom"><img src="images/nice2/bedroom1.avif" alt="Bedroom"></a><span>Bedroom</span></div>
      <div class="tour-item"><a href="#bathroom"><img src="images/nice2/bathroom1.avif" alt="Bathroom"></a> <span>Full bathroom</span></div>
	  <div class="tour-item"><a href="#workspace"><img src="images/nice2/workspace.avif" alt="workspace"></a><span>Workspace</span></div>
	  <div class="tour-item"><a href="#additional"><img src="images/nice2/additional1.avif" alt="Additional"></a><span>Additional photos</span></div>
    </div>

    <!-- Sections -->
	
    <section id="living-room" class="photo-section">
      <div class="section-name">Living Room</div>
      <div class="section-gallery gallery">
        <img src="images/nice2/living area1.avif" onclick="openModal(0)" alt="Living Room" >
        <img src="images/nice2/livingarea2.avif" alt="Living Room" onclick="openModal(1)">
        
      </div>
    </section>

    <section id="kitchen" class="photo-section">
      <div class="section-name">Kitchen</div>
      <div class="section-gallery ">
        <img src="images/nice2/kitchen.avif" alt="Kitchen" onclick="openModal(2)">
      </div>
    </section>
	
	<section id="diningarea" class="photo-section">
      <div class="section-name">Dining Area</div>
      <div class="section-gallery gallery">
        <img src="images/nice2/dining area1.avif" alt="diningarea" onclick="openModal(3)">
		<img src="images/nice2/dining area2.avif" alt="diningarea" onclick="openModal(4)">
      </div>
    </section>

    <section id="bedroom" class="photo-section">
      <div class="section-name">Bedroom</div>
      <div class="section-gallery gallery">
        <img src="images/nice2/bedroom1.avif" alt="Bedroom" onclick="openModal(5)">
        <img src="images/nice2/bedroom2.avif" alt="Bedroom" onclick="openModal(6)">
      </div>
    </section>

    <section id="bathroom" class="photo-section">
      <div class="section-name">Bathroom</div>
      <div class="section-gallery gallery">
        <img src="images/nice2/bathroom1.avif" alt="Bathroom" onclick="openModal(7)">
		<img src="images/nice2/bathroom2.avif" alt="Bathroom" onclick="openModal(8)">
      </div>
    </section>
	
	<section id="workspace" class="photo-section">
      <div class="section-name">Workspace</div>
      <div class="section-gallery ">
        <img src="images/nice2/workspace.avif" alt="Workspace" onclick="openModal(9)">
      </div>
    </section>
	
	<section id="additional" class="photo-section">
      <div class="section-name">Additional photos</div>
      <div class="section-gallery ">
        <img src="images/nice2/additional1.avif" alt="Additional" onclick="openModal(10)">
      </div>
    </section>
	</div>
	
    <!-- Back to top -->
    <div class="back-to-top">
      <a href="#top">Back to top</a>
    </div>
  
  <!-- Modal -->
<div id="modal" class="modal">
    <span class="close" onclick="closeModal()">&times Close</span>

    <img id="modalImage" class="modal-content">
	
	<p id="caption" class="caption"></p>

    <div class="counter" id="counter"></div>

    <a class="prev" onclick="changeImage(-1)">❮</a>
    <a class="next" onclick="changeImage(1)">❯</a>
</div>

 <script src="script2.js"></script>
</body>
</html>
